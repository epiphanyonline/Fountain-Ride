name: Generate official Fountain Ride icon PNGs

on:
  push:
    branches:
      - branding/official-flowing-f-logo-20261115
    paths:
      - 'scripts/build-official-brand-icons.py'
      - 'public/fountain-ride-mark.svg'
      - '.github/workflows/generate-official-brand-icons.yml'

permissions:
  contents: write

jobs:
  generate-icons:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 cairosvg==2.8.2
      - name: Render official 192px and 512px icons
        run: python scripts/build-official-brand-icons.py
      - name: Validate PNGs
        run: |
          python - <<'PY'
          from PIL import Image
          for size in (192,512):
              file=f'public/icon-{size}.png'
              with Image.open(file) as img:
                  assert img.size == (size,size), f'{file}: incorrect dimensions'
                  assert img.format == 'PNG', f'{file}: incorrect format'
              print(f'{file}: validated')
          PY
      - name: Commit generated brand assets on this feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/icon-192.png public/icon-512.png
          if git diff --cached --quiet; then
            echo 'Generated icons unchanged'
          else
            git commit -m 'Render approved Fountain Ride PNG app icons'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
